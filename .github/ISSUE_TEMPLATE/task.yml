name: Engineering Task
description: Terraform, CI/CD, 문서와 검증 등 유지보수 작업을 정의합니다.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        기능은 Feature, 오류는 Bug, 구현 전 설계 승인은 Decision을 사용합니다. 각 항목은 결론부터 간결하게 씁니다.

  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 해결할 유지보수 문제와 기대하는 저장소 또는 운영 상태를 적어주세요.
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: 작업 유형
      options:
        - Terraform resource 또는 module
        - IAM, network 또는 security
        - 실험 파이프라인(workflow, scripts, buildspec)
        - CI/CD
        - 문서
        - 테스트 또는 검증 도구
        - 기타 유지보수
    validations:
      required: true

  - type: dropdown
    id: affected_roots
    attributes:
      label: 영향 root
      description: 변경이 닿는 Terraform root와 영역을 모두 선택합니다.
      multiple: true
      options:
        - terraform/shared
        - terraform/dev
        - terraform/performance-base
        - terraform/performance-experiment (presets 포함)
        - workflow·scripts (.github/workflows, scripts, tests, buildspec)
        - 문서만
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: 관련 계약과 근거
      description: Terraform 파일, README, 승인된 GitHub Issue/PR을 적습니다. 해당 없으면 이유를 적습니다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 변경할 resource, module, workflow, 문서 또는 검증 도구를 적습니다.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: 함께 수행하지 않을 기능 변경, 인프라 교체와 정리 작업을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 검증
      placeholder: |
        - [ ] terraform fmt -check -recursive가 통과한다.
        - [ ] 영향 root(shared, dev, performance-base, performance-experiment)마다 terraform init -backend=false && terraform validate가 통과한다.
        - [ ] terraform plan의 add/change/destroy가 요구사항과 일치한다. AWS 계정 확보 전에는 미실행과 사유를 기록한다.
        - [ ] scripts 변경 시 npm run typecheck와 npm test가 통과한다.
        - [ ] workflow 변경 시 actionlint가 통과한다.
        - [ ] 실험 층, workflow, scripts 또는 buildspec 변경 시 npm run test:floci가 통과한다.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: IaC와 운영 영향
      description: State, AWS resource, IAM(정책 크기 한도, permissions boundary), network, 비용과 Backend 연동 영향을 적습니다. 영향이 없으면 "없음"과 근거를 적습니다.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 미결정 사항과 의존 작업
      description: 선행 작업이나 외부 의존성을 적습니다. 없으면 "없음"으로 작성합니다.
    validations:
      required: true

  - type: input
    id: branch_slug
    attributes:
      label: 브랜치 slug
      description: Issue 번호를 포함한 agent/{issue-number}-{slug}에 사용합니다.
      placeholder: document-performance-deployment
    validations:
      required: true

  - type: dropdown
    id: agent_permission
    attributes:
      label: 에이전트 작업 범위
      description: 선택한 작업 범위만 허용됩니다. push와 PR 생성 선택값에도 병합, AWS apply와 force push 권한은 포함되지 않습니다.
      options:
        - 조사와 진단만 허용 — 파일 변경 금지
        - 파일 수정과 검증까지 허용 — 커밋 금지
        - 검증된 로컬 커밋까지 허용
        - 검증된 로컬 커밋 및 push·PR 생성까지 허용 — 병합 금지
    validations:
      required: true

  - type: checkboxes
    id: ready
    attributes:
      label: 작업 준비 확인
      options:
        - label: 변경 범위가 구체적이며 자격 증명과 State가 포함되지 않았습니다.
          required: true
