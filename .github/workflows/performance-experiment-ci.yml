name: Performance Experiment CI

# Checks for the performance experiment entrypoint: script unit tests, workflow lint, and the
# pipeline test that runs the entrypoint's steps against Floci. The pipeline test reproduces
# the order of steps, not IAM permissions, GitHub OIDC trust or network isolation; those are
# confirmed by the first real apply.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "codebuild/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "scripts/**"
      - "terraform/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: performance-experiment-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: Script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'

  floci-pipeline:
    name: Floci pipeline test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Run the pipeline test
        env:
          FLOCI_PIPELINE: "1"
          FLOCI_TEST_ARTIFACTS: ${{ runner.temp }}/floci-artifacts
        run: node --test --test-concurrency=1 tests/floci/pipeline.test.ts
      - name: Upload the test artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: floci-pipeline-artifacts
          path: ${{ runner.temp }}/floci-artifacts
          if-no-files-found: ignore
